services:
  webapp:
    build:
      context: ./webapp
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${WEBAPP_PORT:-5174}:5173"
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
    environment:
      VITE_MODEL_BUILDER_URL: /api
    depends_on:
      - model-builder

  model-builder:
    build:
      context: ./model-builder
    command: uv run uvicorn sketcher_model_builder.api:create_app --factory --host 0.0.0.0 --port 8000
    volumes:
      - ./model-builder:/app
      - ./.sketcher:/workspace/.sketcher
    environment:
      SKETCHER_WORKSPACE: /workspace/.sketcher
      SKETCHER_MODEL_ARTIFACTS: /workspace/.sketcher/models
      UV_PROJECT_ENVIRONMENT: /tmp/sketcher-model-builder-venv
    networks:
      default:
        aliases:
          - api

volumes:
  webapp_node_modules:
