<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch Route Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="panel">
        <div class="panel__header">
          <h1>Sketcher</h1>
          <p>Draw the route the pencil should travel.</p>
        </div>

        <label class="file-picker">
          <span>Image</span>
          <input id="imageInput" type="file" accept="image/*" />
        </label>

        <div class="control">
          <label for="imageOpacity">Image opacity</label>
          <input id="imageOpacity" type="range" min="0" max="1" step="0.01" value="0.38" />
        </div>

        <div class="control">
          <label for="passes">Passes</label>
          <input id="passes" type="number" min="1" max="300" step="1" value="34" />
        </div>

        <div class="control">
          <label for="jitter">Jitter</label>
          <input id="jitter" type="number" min="0" step="0.01" value="0.12" />
        </div>

        <div class="control">
          <label for="roughness">Roughness</label>
          <input id="roughness" type="number" min="0" step="0.01" value="1.05" />
        </div>

        <div class="control">
          <label for="strokeWidth">Pencil width</label>
          <input id="strokeWidth" type="number" min="0.01" step="0.01" value="0.13" />
        </div>

        <div class="control">
          <label for="opacity">Opacity</label>
          <input id="opacity" type="number" min="0.01" max="1" step="0.01" value="0.13" />
        </div>

        <div class="control">
          <label for="seed">Seed</label>
          <input id="seed" type="number" step="1" value="31" />
        </div>

        <div class="button-grid">
          <button id="newPathButton" type="button">New path</button>
          <button id="undoPointButton" type="button">Undo point</button>
          <button id="undoPathButton" type="button">Undo path</button>
          <button id="clearButton" type="button">Clear</button>
        </div>

        <div class="button-stack">
          <button id="generateButton" type="button" class="primary">Generate sketch</button>
          <button id="replayAnimationButton" type="button" disabled>Replay animation</button>
          <button id="downloadRoutesButton" type="button">Download route SVG</button>
          <button id="downloadSketchButton" type="button">Download sketch SVG</button>
          <button id="downloadProjectButton" type="button">Download project JSON</button>
        </div>

        <div class="status">
          <div><span id="pathCount">0</span> paths</div>
          <div><span id="pointCount">0</span> points</div>
        </div>
      </aside>

      <section class="workspace">
        <div class="stage-shell">
          <svg id="stage" class="stage" viewBox="0 0 1000 700" role="img" aria-label="Drawing stage">
            <rect class="paper" x="0" y="0" width="1000" height="700" />
            <image id="backgroundImage" class="reference-image" href="" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
            <g id="routeLayer"></g>
            <g id="previewLayer"></g>
          </svg>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
